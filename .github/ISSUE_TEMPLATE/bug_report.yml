name: Bug report
description: 报告可以稳定复现的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除日志、截图和样本中的密钥、个人信息与无权分享的媒体内容。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 说明实际行为与预期行为。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 选择...
        3. 出现...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Node.js、pnpm 和 FFmpeg 版本。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: shell

name: Feature request
description: 提议符合本地优先方向的新能力
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 说明当前工作流中的具体问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望的交互、输入、输出和是否需要云端服务。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 已尝试或考虑过的替代方法。
